name: pasa
description: "A new Flutter project."

publish_to: 'none' 


version: 1.0.0+1

environment:
  sdk: ^3.10.0


dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.2.2
  go_router: ^17.0.0
  supabase_flutter: ^2.10.3
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  get_it: ^9.1.1
  connectivity_plus: ^7.0.0
  internet_connection_checker_plus: ^2.9.1+1
  flutter_animate: ^4.5.2

  
  cupertino_icons: ^1.0.8
  shared_preferences: ^2.5.4
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.2.3
  build_runner: ^2.10.4
  json_serializable: ^6.11.2
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_native_splash: ^2.4.7
flutter_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/images/logo.png"
  adaptive_icon_background: "#111111"
  adaptive_icon_foreground: "assets/images/logo.png"




flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/fonts/
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/lato/Lato-Regular.ttf
        - asset: assets/fonts/lato/Lato-Italic.ttf
        - asset: assets/fonts/lato/Lato-Bold.ttf
          weight: 700
    - family: Oswald
      fonts:
        - asset: assets/fonts/oswald/Oswald-Regular.ttf
        - asset: assets/fonts/oswald/Oswald-SemiBold.ttf
        - asset: assets/fonts/oswald/Oswald-Bold.ttf
          weight: 700

  


 